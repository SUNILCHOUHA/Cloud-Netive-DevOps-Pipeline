apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 75.6.2 

    helm: 
      values: |
        grafana:
          enabled: true 
          adminUser: admin 
          adminPassword: gitops123 
          service:
            type: LoadBalancer
        prometheus:
          prometheusSpec: 
            retention: 7d
        
        alertmanager:
          enabled: true

          alertmanagerSpec:
            configSecret: smtp-secret
  destination: 
    server: https://kubernetes.default.svc 
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      
    syncOptions:
      - CreateNamespace=true 