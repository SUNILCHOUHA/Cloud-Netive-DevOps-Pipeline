apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-alerts
  namespace: monitoring
  labels:
    release: prometheus 

spec:
  groups:
  - name: custom-alerts

    rules:

    - alert: HighCPUUsage
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 5
      for: 30s

      labels:
        severity: warning

      annotations:
        summary: High CPU Usage
        description: CPU usage is above 5%