apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-crds
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: default

  source:
    repoURL: https://github.com/sunilchouhan07/cloud-native-devops-pipeline
    targetRevision: main
    path: gitops-k8s/monitoring-crds

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true